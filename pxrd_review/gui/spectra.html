<!doctype html>
<html lang="en" data-theme="clear-dark" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PXRD review — spectrum</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/sp.css">
</head>
<body class="sp">
  <header id="topbar">
    <div class="brand">Spectrum</div>
    <select id="sp-file" title="A spectrum file of the open folder, or one opened here.&#10;Text, CSV, a workbook sheet, RRUFF, JCAMP-DX, .spc, .spa or an OPUS file."></select>
    <button id="sp-open" title="Open a spectrum file from anywhere on this machine. It is read into this window only: nothing is copied into the folder, and nothing leaves the machine.">Open file…</button>
    <input type="file" id="sp-upload" class="hidden" title="a spectrum file, or a session (…_sp.json) written by an export">
    <select id="sp-series" class="hidden" title="Which spectrum of the file (a sheet or a file may hold several)"></select>
    <select id="sp-kind" title="What the spectrum is. An infrared transmittance spectrum is converted to absorbance before anything else.">
      <option value="">kind: as guessed</option>
      <option value="raman">Raman</option>
      <option value="ir-absorbance">infrared, absorbance</option>
      <option value="ir-transmittance">infrared, transmittance</option>
    </select>
    <div class="spacer"></div>
    <label class="muted" title="The structure: its uranyl U–O and hydrogen-bond D···A distances are turned into the positions the two relations expect (Bartlett &amp; Cooney; Libowitzky) and drawn as green ticks.">.cif <select id="sp-cif"></select></label>
    <label class="muted" title="The manuscript or paper: the band positions its text states are drawn as orange marks and set beside the fitted bands.">manuscript <select id="sp-ms"></select></label>
    <span id="sp-status" class="muted"></span>
  </header>

  <div id="sp-app">
    <aside id="sp-side">
      <section>
        <h3>Clean</h3>
        <div class="row hidden" id="sp-laser-row"><label title="This spectrum's axis is in nanometres. For a Raman spectrum recorded against absolute wavelength, the laser line turns it into Raman shift (cm⁻¹).">laser <input type="number" id="sp-laser" min="200" max="2000" step="0.1" placeholder="nm"> nm</label></div>
        <label title="A jump up and back down within a point or two is taken out. With the resolution given, anything narrower than it goes; without, only what is one or two points wide and has no flanks — a sharp band two or three points wide is left alone."><input type="checkbox" id="sp-despike"> remove cosmic rays</label>
        <div class="row"><label title="How many robust deviations a jump between two points must be to count. Lower finds more.">threshold <input type="number" id="sp-threshold" value="8" min="3" max="100" step="1"></label>
          <label title="The spectral resolution (cm⁻¹). An event is removed only when it is narrower than this — a real band cannot be. Also used by the fit's warnings.">resolution <input type="number" id="sp-resolution" min="0.1" max="100" step="0.1" placeholder="cm⁻¹"></label></div>
        <div id="sp-spikes" class="muted"></div>
      </section>
      <section>
        <h3>Baseline</h3>
        <select id="sp-baseline">
          <option value="none">none</option>
          <option value="als">asymmetric least squares</option>
          <option value="snip">SNIP (clipping)</option>
          <option value="rubber">rubber band (convex hull)</option>
          <option value="anchors">anchor points</option>
        </select>
        <div class="row sp-b sp-b-als"><label title="Stiffness. The baseline can follow nothing narrower than about 2π·λ^¼ cm⁻¹: 10⁵ follows a background that curves over 100 cm⁻¹, 10⁷ over 350 cm⁻¹ (safe under most bands), 10⁹ over 1100 cm⁻¹ (for broad O–H bands), 10¹¹ is nearly a straight line.">stiffness 10^<input type="number" id="sp-lam" value="7" min="0" max="14" step="0.5"></label>
          <label title="How far under the bands the baseline stays: smaller is lower.">asymmetry <input type="number" id="sp-p" value="0.01" min="0.0001" max="0.5" step="0.005"></label></div>
        <div class="row sp-b sp-b-snip"><label title="The clipping half-width (cm⁻¹): wider than the foot of the broadest band to be kept.">half-width <input type="number" id="sp-width" value="150" min="5" max="2000" step="10"></label></div>
        <div class="row sp-b sp-b-anchors"><span class="muted">choose ‘anchor’ above the plot and click where the baseline is; </span><button id="sp-anchors-clear">clear</button></div>
      </section>
      <section>
        <h3>Region</h3>
        <div class="row" title="The stretch that is fitted. To change a fitted region, type new limits here or drag either of its edges in the plot (the tabs on the shaded box): its bands stay, and those left outside are removed. A stretch clear of every fitted region is a new region."><input type="number" id="sp-lo" step="1" placeholder="from"> – <input type="number" id="sp-hi" step="1" placeholder="to"> cm⁻¹</div>
        <div class="row" id="sp-presets"></div>
      </section>
      <section>
        <h3>Fit</h3>
        <div class="row"><label title="The shape of every band of the region (changing it changes them all — one step of undo) and of the bands added from here on. One band's own shape: its row in the table.">shape <select id="sp-shape"><option value="pvoigt">pseudo-Voigt</option><option value="gauss">Gaussian</option><option value="lorentz">Lorentzian</option></select></label></div>
        <div class="row"><label title="What the region's own baseline may still be after the subtraction above.">local baseline <select id="sp-local"><option value="linear">sloping</option><option value="const">constant</option><option value="none">none</option></select></label></div>
        <div class="row"><label title="Every band of the region takes one common width and shape — for a multiplet of one kind."><input type="checkbox" id="sp-share-w"> one width for all</label>
          <label title="Every pseudo-Voigt band takes one common shape parameter η; the widths stay their own. A dozen overlapping bands do not fix a dozen shapes — with one η the fit has that many parameters fewer and settles."><input type="checkbox" id="sp-share-eta"> one η</label></div>
        <div class="row"><label title="How many bands the automatic fit uses. Empty: as many as the data support, up to the number on the right.">bands <input type="number" id="sp-n" min="1" max="16" step="1" placeholder="auto"></label>
          <label title="The most bands the automatic fit may use.">at most <input type="number" id="sp-maxn" value="12" min="1" max="16" step="1"></label></div>
        <div class="row"><label title="The widest a band may be (cm⁻¹). What keeps a component of a broad envelope — the O–H stretches — from widening into the whole envelope: with a limit the fit must use several narrower bands. A band resting on the limit is said so.">widest <input type="number" id="sp-wmax" min="1" max="5000" step="5" placeholder="any"></label>
          <label title="The narrowest a band may be (cm⁻¹).">narrowest <input type="number" id="sp-wmin" min="0.1" max="5000" step="1" placeholder="any"></label></div>
        <div class="row"><label title="How small a band the automatic fit, ‘+ band’ and the marks under the plot may propose: its share of the curve where it stands (%). Lower finds more — and weaker — bands.">smallest band <input type="number" id="sp-share" value="3" min="0" max="50" step="1"> %</label></div>
        <div class="row"><label title="What ‘Fit these’ — and the refit after each change — may move. On an envelope of many overlapping bands a fit of everything moves everything: set the bands by hand, let the fit find their heights, then release the widths, then the positions. A band’s own ‘hold’ boxes add to this.">refine <select id="sp-refine">
            <option value="all">everything</option><option value="heights">heights only</option><option value="widths">heights + widths</option><option value="positions">heights + positions</option></select></label></div>
        <div class="row"><label title="Start the automatic fit from the positions the structure expects (the green ticks inside the region)."><input type="checkbox" id="sp-seed"> from the structure</label>
          <label title="After every change to a band — a drag, an added, removed, split or merged band, an edited number — the HEIGHTS of all bands are fitted again at once. Nothing else moves and no band is removed: what you placed stays where you placed it. ‘Fit these’ then refines whatever ‘refine’ allows. Off: changes are only previewed (dashed) until ‘Fit these’."><input type="checkbox" id="sp-live" checked> heights follow edits</label></div>
        <div class="row"><button id="sp-auto" class="primary" title="Find the bands of the region and fit them: every band the second derivative shows at any scale, then whatever the residual still holds, then each band tested for removal.">Auto fit</button>
          <button id="sp-refit" title="Refine the bands of the table: what ‘refine’ allows to move, moves. A band the fit drives to zero height is taken out, and said.">Fit these</button>
          <button id="sp-clear" title="Remove this region and its bands (undo brings them back).">Clear</button></div>
        <div class="row"><button id="sp-add" title="One more band, where the residual of the present bands is largest (the ▲ marks under the plot show where), and refit. To put a band where YOU see one, choose ‘band’ above the plot and click there.">+ band</button>
          <button id="sp-less" title="Remove the weakest band and refit.">− band</button>
          <button id="sp-undo" title="Back to the bands before the last change (⌘Z / Ctrl-Z).">undo</button>
          <button id="sp-redo" title="Forward again.">redo</button></div>
      </section>
      <section>
        <h3>Written files</h3>
        <div class="muted" title="Every export also writes a session file (…_sp.json): the options and every band as they stand. Click one below — or open it with Open file… — to take the fit up again where it was left.">Written files (click to open; a session reopens the fit):</div>
        <div id="sp-outputs" class="muted"></div>
      </section>
    </aside>

    <main id="sp-main">
      <div id="sp-tools">
        <div id="sp-mode" class="seg">
          <button data-m="pan" class="on" title="Drag to move along the axis; scroll to zoom (Shift-scroll: the height); double-click for the whole spectrum.">move</button>
          <button data-m="region" title="Drag across the bands to fit: that stretch becomes the region. (Shift-drag does the same in any mode.)">region</button>
          <button data-m="band" title="Click where a band is to add it to the region's fit — at the height you click.">band</button>
          <button data-m="anchor" title="Click where the spectrum is baseline (with the anchor-points baseline).">anchor</button>
        </div>
        <span class="muted" title="In the plot: drag a band's ● to move it and set its height, its ◆ to set its width; click a band to select it; Delete removes the selected band, ← → nudge it (Shift: by 5 cm⁻¹); click a ▲ under the plot to add the band the residual suggests there; drag a ▮ tab on either edge of the shaded region to change the stretch that is fitted. Scroll zooms along the axis; Shift-scroll (or scroll over the height axis) enlarges the foot of the curve; double-click shows everything again.">● move · ◆ width · ▲ add · Del remove · ▮ region edge · ⇧scroll height</span>
        <span id="sp-busy" class="hidden">fitting…</span>
        <span id="sp-readout" class="muted"></span>
      </div>
      <div id="sp-layers" class="muted">show:
          <label><input type="checkbox" data-layer="raw"> as recorded</label>
          <label><input type="checkbox" data-layer="comps" checked> bands</label>
          <label><input type="checkbox" data-layer="ticks" checked> structure</label>
          <label><input type="checkbox" data-layer="stated" checked> manuscript</label>
          <label><input type="checkbox" data-layer="peaks"> found bands</label>
          <label title="A ruler over the plot: the O···O distance of the hydrogen bond whose O–H stretch would stand at each wavenumber — Libowitzky (1999). The pointer reads it; each fitted band is marked on it. A correlation with scatter: it places a band, it does not measure a bond."><input type="checkbox" data-layer="oo" checked> O···O Å</label>
          <label title="Two rulers over the plot: the uranyl U–O distance a band would mean as ν1 and as ν3 (UO2)2+ — Bartlett &amp; Cooney (1989). Switched on by itself when the structure beside the spectrum has a uranyl ion."><input type="checkbox" data-layer="uo"> U–O Å</label>
          <label title="The second derivative of the spectrum, bands pointing up, smoothed over the width on the right: a component hidden in an envelope shows as a bump of its own. Narrow width = fine detail and noise; wide = the broad components."><input type="checkbox" data-layer="d2"> 2nd derivative</label>
          <label title="The smoothing width of the second derivative (cm⁻¹)."><input type="number" id="sp-d2w" value="25" min="2" max="500" step="5"> cm⁻¹</label>
          <label title="High wavenumber on the left, as an infrared spectrum is printed."><input type="checkbox" data-layer="reverse"> high → low</label>
      </div>
      <div id="sp-plot" title=""></div>
      <div id="sp-split" title="Drag to give the plot or the band table more room. Double-click: back to the usual split."></div>
      <div id="sp-notes"></div>
      <div id="sp-result">
        <div id="sp-rhead"><div id="sp-stats" class="muted"></div><div id="sp-export" class="hidden" title="Write the fitted bands into the folder's review_out">export <button data-fmt="xlsx" title="Write the band table as a workbook into the folder's review_out, and open it.">Excel</button><button data-fmt="word" title="Write the band table as a Word file into the folder's review_out, and open it.">Word</button><button data-fmt="text" title="Write the band table as text, the figure (.svg) and the session into the folder's review_out.">Text + figure</button></div></div>
        <div id="sp-exported" class="hidden"></div>
        <div id="sp-hint" class="hidden"></div>
        <table id="sp-table"></table>
        <div id="sp-warnings"></div>
        <div id="sp-compare"></div>
      </div>
    </main>
  </div>

  <script src="/static/sp.js"></script>
</body>
</html>
